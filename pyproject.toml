[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stallings-amalgams"
version = "0.1.0"
description = "Python implementation of Stallings foldings for subgroups of amalgams of finite groups"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "networkx",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
packages = ["stallings_amalgams"]
